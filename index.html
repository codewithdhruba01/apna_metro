<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>MetroMap - Premium Metro Route Finder & Navigation</title>
    <meta name="description" content="Explore metro networks, discover optimal routes, and plan your journey across Delhi, Kolkata, and Chennai with verified transit data and interactive maps." />
    <!-- Instant flash-free theme loader: executes synchronously before body renders -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('metromap-theme');
          var isDark = stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.style.backgroundColor = '#000000';
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.style.backgroundColor = '#ffffff';
            root.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-white text-zinc-900 dark:bg-black dark:text-zinc-100 antialiased selection:bg-blue-500 selection:text-white min-h-screen font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
